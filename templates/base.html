<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>{% block title %}AridDB{% endblock %}</title>
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Nunito+Sans:wght@400;600;700;800&family=Roboto+Slab:wght@500;700&display=swap" rel="stylesheet">
	<link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">
	{% block head %}{% endblock %}
</head>
<body>
	<header class="site-header">
		<nav class="nav-shell" aria-label="Main navigation">
			<a class="brand" href="{{ url_for('hello_world') }}" aria-label="AridDB home">
				<img src="{{ url_for('asset_file', filename='AridDB-logo.svg') }}" alt="AridDB">
			</a>
			<div class="nav-links">
				{% block tabs %}
				<a class="nav-link {% if request.endpoint == 'hello_world' %}active{% endif %}" href="{{ url_for('hello_world') }}">Home</a>
				<a class="nav-link {% if request.endpoint == 'docs' %}active{% endif %}" href="{{ url_for('docs') }}">Documentation</a>
				<a class="nav-link external" href="https://github.com/CheefLofter/AridDB">Source code</a>
				{% endblock %}
			</div>
		</nav>
	</header>

	<main class="page-shell">
		{% block body %}{% endblock %}
	</main>

	<footer class="site-footer">
		<span>AridDB · a small database project for Python.</span>
		<span>Made as a college project.</span>
	</footer>
	{% block scripts %}{% endblock %}
</body>
</html>
