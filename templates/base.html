<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>{% block title %}AridDB{% endblock %}</title>

	<link
		href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
		rel="stylesheet"
		integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
		crossorigin="anonymous"
	>
	{% block head %}{% endblock %}
</head>
<body>
	<header>
		<nav class="navbar navbar-expand-lg bg-body-tertiary border-bottom">
			<div class="container">
				<a class="navbar-brand" href="{{ url_for('hello_world') }}">
					{% block brand %}AridDB{% endblock %}
				</a>
				<button
					class="navbar-toggler"
					type="button"
					data-bs-toggle="collapse"
					data-bs-target="#main-navigation"
					aria-controls="main-navigation"
					aria-expanded="false"
					aria-label="Toggle navigation"
				>
					<span class="navbar-toggler-icon"></span>
				</button>
				<div class="collapse navbar-collapse" id="main-navigation">
					<ul class="navbar-nav me-auto mb-2 mb-lg-0">
						{% block tabs %}
						<li class="nav-item">
							<a class="nav-link active" aria-current="page" href="{{ url_for('hello_world') }}">Home</a>
						</li>
						{% endblock %}
					</ul>
					{% block navigation_actions %}{% endblock %}
				</div>
			</div>
		</nav>
	</header>

	<main class="container py-4">
		{% block body %}{% endblock %}
	</main>

	<script
		src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
		integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
		crossorigin="anonymous"
	></script>
	{% block scripts %}{% endblock %}
</body>
</html>
